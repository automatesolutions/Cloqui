# Manual deploy to Google Cloud Run. Runs only when you start it from the Actions tab.
# Needs the accounts and settings in docs/deploy.md first. Until then, it fails at the first step
# without touching anything.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: "Apply database migrations first"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # Keyless sign-in to Google Cloud (Workload Identity Federation)

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloqui

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Check settings
        run: |
          for v in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOY_SA NEXT_PUBLIC_APP_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_LIVEKIT_URL S3_ENDPOINT; do
            if [ -z "${!v}" ]; then echo "Missing repository variable $v (see docs/deploy.md)"; exit 1; fi
          done
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_LIVEKIT_URL: ${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Apply migrations
        if: inputs.migrate
        uses: supabase/setup-cli@v1
      - if: inputs.migrate
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Build and push images
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$REGISTRY/web:$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_LIVEKIT_URL="${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}" \
            --build-arg S3_ENDPOINT="${{ vars.S3_ENDPOINT }}" .
          docker build -f media/Dockerfile -t "$REGISTRY/media:$GITHUB_SHA" .
          docker push "$REGISTRY/web:$GITHUB_SHA"
          docker push "$REGISTRY/media:$GITHUB_SHA"

      # Secrets come from Secret Manager at runtime; nothing secret is in the image or this log.
      - name: Deploy web
        run: |
          gcloud run deploy cloqui-web --region "$REGION" --image "$REGISTRY/web:$GITHUB_SHA" \
            --allow-unauthenticated --min-instances 0 --max-instances 3 --memory 512Mi \
            --set-env-vars "NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }},NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }},NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }},NEXT_PUBLIC_LIVEKIT_URL=${{ vars.NEXT_PUBLIC_LIVEKIT_URL }},S3_ENDPOINT=${{ vars.S3_ENDPOINT }},S3_BUCKET=cloqui-media,EMAIL_TRANSPORT=resend,EMAIL_FROM=${{ vars.EMAIL_FROM }}" \
            --set-secrets "SUPABASE_SERVICE_ROLE_KEY=supabase-service-role:latest,DATABASE_URL=database-url:latest,S3_ACCESS_KEY_ID=r2-access-key-id:latest,S3_SECRET_ACCESS_KEY=r2-secret-access-key:latest,LIVEKIT_API_KEY=livekit-api-key:latest,LIVEKIT_API_SECRET=livekit-api-secret:latest,RESEND_API_KEY=resend-api-key:latest,CRON_SECRET=cron-secret:latest"

      - name: Deploy media worker job
        run: |
          gcloud run jobs deploy cloqui-media --region "$REGION" --image "$REGISTRY/media:$GITHUB_SHA" \
            --memory 2Gi --cpu 2 --task-timeout 30m --max-retries 1 \
            --set-env-vars "S3_ENDPOINT=${{ vars.S3_ENDPOINT }},S3_BUCKET=cloqui-media" \
            --set-secrets "DATABASE_URL=database-url:latest,S3_ACCESS_KEY_ID=r2-access-key-id:latest,S3_SECRET_ACCESS_KEY=r2-secret-access-key:latest"
